"dataset_name": "boolean_expressions"
"description": "Evaluate the result of a random Boolean expression.\n\n"
"doc_to_text": "Answer the following True/False question. The last line of your response should be in the following format: 'Answer: True/False' (e.g. 'Answer: True').\n\n{{input}}\n"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_boolean_expressions"

filter_list:
  - name: "strict-match"
    filter:
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "\\b(True|False)\\b"
      - function: "take_first"
