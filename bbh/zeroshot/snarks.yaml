"dataset_name": "snarks"
"description": "Determine which of two sentences is sarcastic.\n\nAccording to Cambridge University Dictionary, sarcasm is \"the use of remarks that clearly mean the opposite of what they say, made in order to hurt someone's feelings or to criticize something in a humorous way.\" Sarcastic sentences often contain satirical or ironic utterances, hyperboles, ambivalent or witty remarks.\n\n"
"doc_to_text": "Answer the following multiple choice question. The last line of your response should be in the following format: 'Answer: A/B/C/D/E/F/G/H/I/J' (e.g. 'Answer: A').\n\n{{input}}\n"
"doc_to_target": "{{target.strip('()')}}"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_snarks"
filter_list:
  - name: "strict-match"
    filter:
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: !function utils.MultiChoiceRegexFilter
        group_select: -1
        ignore_case: true
        ignore_punctuation: true
        regex_pattern: "[\\*\\_]{0,2}[Aa]nswer[\\*\\_]{0,2}\\s*:[\\s\\*\\_]{0,2}\\s*\\(?([A-Z])(?![a-zA-Z0-9])|\\boxed\\{[^}]*([A-Z])[^}]*\\}|answer is \\(?([a-zA-Z])|answer is \\(?([a-zA-Z])|([A-Z])\\)\\s*[^A-Z]*|([A-Z])\\)?\\s+is\\s+the\\s+correct\\s+answer|([A-Z])\\)?\\s*$|([A-Z])\\)?\\s*\\.|([A-Z])\\)?\\s*[^\\w]"
      - function: "take_first"
