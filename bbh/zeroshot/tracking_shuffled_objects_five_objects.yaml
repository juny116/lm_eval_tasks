"dataset_name": "tracking_shuffled_objects_five_objects"
"description": "A task requiring determining the final positions of a set of objects given their initial positions and a description of a sequence of swaps.\n\n"
"doc_to_text": "Answer the following question. The last line of your response should be in the following format: 'Answer: [answer]' (e.g. 'Answer: (A)').\n\n{{input}}\n"
"doc_to_target": "{{target.strip('()')}}"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_tracking_shuffled_objects_five_objects"
filter_list:
  - name: "strict-match"
    filter:
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: !function utils.MultiChoiceRegexFilter
        group_select: -1
        ignore_case: true
        ignore_punctuation: true
        regex_pattern: "[\\*\\_]{0,2}[Aa]nswer[\\*\\_]{0,2}\\s*:[\\s\\*\\_]{0,2}\\s*\\(?([A-Z])(?![a-zA-Z0-9])|\\boxed\\{[^}]*([A-Z])[^}]*\\}|answer is \\(?([a-zA-Z])|answer is \\(?([a-zA-Z])|([A-Z])\\)\\s*[^A-Z]*|([A-Z])\\)?\\s+is\\s+the\\s+correct\\s+answer|([A-Z])\\)?\\s*$|([A-Z])\\)?\\s*\\.|([A-Z])\\)?\\s*[^\\w]"
      - function: "take_first"
