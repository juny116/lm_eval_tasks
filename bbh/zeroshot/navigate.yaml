"dataset_name": "navigate"
"description": "Given a series of navigation instructions, determine whether one would end up back at the starting point.\n\n"
"doc_to_text": "Answer the following Yes/No question. The last line of your response should be in the following format: 'Answer: Yes/No' (e.g. 'Answer: Yes').\n\n{{input}}\n"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_navigate"
filter_list:
  - name: "strict-match"
    filter:
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "\\b(Yes|No|yes|no)\\b"
      - function: "take_first"
