dataset_path: HAERAE-HUB/HAE_RAE_BENCH_1.1
test_split: test
fewshot_split: test
output_type: generate_until
doc_to_text: "다음 객관식 문제에 답하세요. 응답의 마지막 줄은 다음 형식이어야 합니다: '정답: A/B/C/D/E' (예: '정답: A').\n\n{{query}}"
doc_to_target: "{{answer.lstrip('(').rstrip(')')}}"
filter_list:
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "정답은\\s*[\\'\\*]*\\(?([A-E])\\)?[\\'\\*]*|답은\\s*[\\'\\*]*\\(?([A-E])\\)?[\\'\\*]*|정답:\\s*[\\'\\*]*\\(?([A-E])\\)?[\\'\\*]*|답:\\s*[\\'\\*]*\\(?([A-E])\\)?[\\'\\*]*|([A-E]):\\s|([A-E])\\)\\s|[Aa]:\\s*\\(?([A-E])\\)?|[\\'\\*]*\\(?([A-E])\\)?[\\'\\*]*.+[은는이가]\\s*올바른|[\\'\\*]*\\(?([A-E])\\)?[\\'\\*]*.+[은는이가]\\s*정답|\\boxed\\{\\(?([A-E])\\)?\\}|[^a-zA-Z0-9]([A-E])[^a-zA-Z0-9]|^\\s*([A-E])\\s*$"
generation_kwargs:
  until:
    - "Question:"
  max_gen_toks: 8192
  do_sample: true
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.1
