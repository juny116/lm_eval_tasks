dataset_name: proverbs_denoising
include: _default_haerae_1.1.yaml
task: haerae_1.1_proverbs_denoising
doc_to_text: "최종 답변은 반드시 다음 형식으로 작성하세요:\n정답: [MASK에 들어갈 속담]\n\n예시:\n정답: 나는 새에게 여기 앉아라 저기 앉아라 할 수 없다\n\n{{query}}\n\n"
doc_to_target: "{{answer}}"
output_type: generate_until
filter_list:
  - name: "flexible-extract"
    filter:
      - function: "regex"
        regex_pattern: "정답:\\s*(.+?)(?:\n|$)"
        group_select: -1
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
